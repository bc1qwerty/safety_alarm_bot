name: Check Safety Notices

on:
  schedule:
    # UTC 기준 (KST = UTC+9)
    # KST 08:00~18:00 사이 30분 간격 실행
    # UTC 23:00~09:00
    - cron: '0,30 23 * * 0-4'   # KST 08:00, 08:30 (월~금)
    - cron: '0,30 0-9 * * 1-5'  # KST 09:00~18:30 (월~금)
  workflow_dispatch:  # 수동 실행
    inputs:
      bootstrap:
        description: "First-deploy bootstrap (mark all items seen, skip dispatch)"
        type: boolean
        default: false

permissions:
  contents: write

# Opt the Node-20 actions (checkout, cache, setup-go, setup-chrome) into the
# Node 24 runtime ahead of the 2026-06-02 forced cutover. Cleaner than bumping
# each action major one by one — actions/cache and browser-actions/setup-chrome
# have no Node-24 release yet, so this env var covers them all at once.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # go.mod uses `replace ../txid-bot-framework` (local dev convention).
      # Check the framework out as a sibling so the GHA build resolves it.
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: bc1qwerty/txid-bot-framework
          path: txid-bot-framework-checkout
          ref: main

      - name: Stage framework sibling
        run: mv txid-bot-framework-checkout ../txid-bot-framework

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Run unit tests before producing a binary. Locks in the kosha_notice
      # pairing invariants (no sticky / 1 sticky / N stickies / invariant
      # break must drop the row) so the title<->URL off-by-one bug cannot
      # silently regress on a future refactor. If tests fail, the bot does
      # NOT run, so no wrong-URL notifications can go out.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o safety-alarm-bot .

      # Persist bot_seen across runs. Without this every scheduled run
      # starts from an empty SQLite and would treat the existing
      # backlog as new alerts.
      #
      # Cache key prefix bumped to v2 on 2026-05-19 to invalidate the
      # broken legacy caches that only contained the 250-byte schema-only
      # main DB (the WAL sidecar was never captured, so every restore
      # was effectively an empty DB and dedup was silently disabled —
      # the bot redispatched up to 10 kosha_* items every 30 minutes).
      - name: Restore framework DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/safety-alarm.db
          key: safety-alarm-db-v2-${{ github.run_id }}
          restore-keys: safety-alarm-db-v2-

      # ⚠ dedup 네임스페이스 이관(2026-09-08). 프레임워크가 bot_seen 키로
      # MultiSource 의 합성 이름(`multi[하위소스 목록]`)을 쓰던 시절의 캐시가
      # 남아 있으면, 하위 소스별 dedup 으로 바뀐 첫 실행에서 백로그가 전부
      # 신규로 보이고 MaxItemsPerPoll(10) 초과분이 **발송 없이 seen 처리돼
      # 영구 유실**된다. mac 에서 실제로 그 사고를 한 번 냈다(신규 8건 중
      # 7건 유실, kosha_accident 5건 포함 — 수동 복구함).
      #
      # 이 스텝은 멱등이다: 옮길 행이 없으면 아무것도 하지 않는다. 캐시가
      # 언제 갱신되든 자기 치유되도록 매 실행에 둔다.
      - name: Migrate dedup namespace (idempotent)
        run: |
          if [ -f data/safety-alarm.db ]; then
            ./scripts/migrate-dedup-namespace.sh data/safety-alarm.db --apply
          else
            echo "캐시 DB 가 없다 — 첫 실행이거나 캐시 미스. 이관 불필요."
          fi

      # ⚠ dedup 상태의 유일한 사본이 이 캐시다. 없어지면(7일 미접근, 리포 10GB 초과,
      #   수동 삭제) 빈 DB 로 봇이 뜨고 크롤한 글 전부가 신규로 보인다. 그러면
      #   MaxItemsPerPoll(10) 초과분이 **발송 없이 seen 처리돼 영구 유실**된다.
      #   위 v2 주석이 바로 그 사고의 기록이다 — 깨진 캐시가 사실상 빈 DB 였고
      #   dedup 이 조용히 꺼져 있었다. 2026-09-08 에는 같은 결말을 낡은 바이너리가
      #   만들어 7건을 잃었다. 방아쇠만 다를 뿐 결말은 늘 같다.
      #
      #   BOOTSTRAP_DEDUP 은 이미 있었지만 **수동 dispatch 입력으로만** 켤 수 있었다.
      #   캐시 미스는 job 실패가 아니라 아무 신호도 없으므로, 사람이 그 입력을 켜야
      #   한다는 사실을 알 방법이 없다. 자동으로 판정한다.
      #
      #   판정은 cache-hit 출력이 아니라 **파일 존재와 크기**로 한다 — restore-keys
      #   부분일치일 때 cache-hit 은 false 이고, 위 v2 사고처럼 250바이트짜리 껍데기가
      #   복원되는 경우도 있다. 실제로 쓸 수 있는 DB 인지를 본다.
      #   ⚠ "판정 실패" 와 "0행" 을 반드시 구분한다. sqlite3 가 없어졌을 때 그것을
      #   0행으로 뭉뚱그리면 매 실행이 부트스트랩이 되고 **봇이 영구히 조용해진다** —
      #   막으려던 유실보다 나쁘다. 판정할 수 없으면 정상으로 두고 그 사실을 알린다
      #   (check-unpushed 의 "판정 불능" 과 같은 처리).
      - name: Detect dedup cache loss
        id: dedup-state
        run: |
          DB=data/safety-alarm.db
          if ! command -v sqlite3 >/dev/null 2>&1; then
            BOOT=0; REASON="sqlite3 가 없어 판정 불능 — 이번엔 정상으로 두지만 유실 감시가 꺼져 있다"; LEVEL=warn
          elif [ ! -s "$DB" ]; then
            BOOT=1; REASON="DB 파일이 없거나 비어 있다"; LEVEL=loss
          elif ! ROWS=$(sqlite3 "$DB" 'SELECT COUNT(*) FROM bot_seen;' 2>/dev/null); then
            BOOT=1; REASON="bot_seen 조회 실패 — 스키마가 깨졌다"; LEVEL=loss
          elif [ "$ROWS" -eq 0 ]; then
            BOOT=1; REASON="bot_seen 0행 (250바이트 껍데기 캐시가 복원됐을 때의 모습이다)"; LEVEL=loss
          else
            BOOT=0; REASON="bot_seen ${ROWS}행 — 정상"; LEVEL=ok
          fi
          echo "bootstrap=$BOOT" >> "$GITHUB_OUTPUT"
          echo "판정: $REASON (bootstrap=$BOOT)"
          [ "$LEVEL" = ok ] && exit 0
          echo "::warning::$REASON"
          if [ "$LEVEL" = loss ]; then
            TEXT="🟠 safety_alarm dedup 캐시 유실%0A${REASON}%0A이번 실행은 발송 없이 재수립만 합니다(한 주기 누락).%0A반복되면 캐시 대신 영속 저장소를 검토하세요."
          else
            TEXT="🟠 safety_alarm dedup 감시 불능%0A${REASON}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${TEXT}%0A로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true

      - name: Run bot (skip moel — runs from dell instead, see Korean IP requirement)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
          NOTIFICATION_HUB_URL: ${{ secrets.NOTIFICATION_HUB_URL }}
          NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
          BAND_KEY: ${{ secrets.BAND_KEY }}
          SAFETY_ALARM_SKIP: moel
          # 수동 dispatch 로 켜거나, 위에서 캐시 유실이 감지되면 자동으로 켜진다.
          BOOTSTRAP_DEDUP: ${{ (github.event.inputs.bootstrap == 'true' || steps.dedup-state.outputs.bootstrap == '1') && '1' || '' }}
        run: ./safety-alarm-bot

      # Defense in depth — main.go already runs PRAGMA wal_checkpoint on
      # exit, but if the binary ever crashes mid-poll the WAL sidecar can
      # still hold uncommitted rows. Force a TRUNCATE checkpoint so the
      # cache step only needs to capture data/safety-alarm.db itself.
      - name: Checkpoint WAL into main DB
        if: always()
        run: |
          if [ -f data/safety-alarm.db ]; then
            sqlite3 data/safety-alarm.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi

      - name: Save framework DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/safety-alarm.db
          key: safety-alarm-db-v2-${{ github.run_id }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_post_ids.json
          git diff --cached --quiet || git commit -m "chore: update last_post_ids"
          git push

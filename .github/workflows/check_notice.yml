name: Check Safety Notices

on:
  schedule:
    # UTC 기준 (KST = UTC+9)
    # KST 08:00~18:00 사이 30분 간격 실행
    # UTC 23:00~09:00
    - cron: '0,30 23 * * 0-4'   # KST 08:00, 08:30 (월~금)
    - cron: '0,30 0-9 * * 1-5'  # KST 09:00~18:30 (월~금)
  workflow_dispatch:  # 수동 실행
    inputs:
      bootstrap:
        description: "First-deploy bootstrap (mark all items seen, skip dispatch)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # go.mod uses `replace ../txid-bot-framework` (local dev convention).
      # Check the framework out as a sibling so the GHA build resolves it.
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: bc1qwerty/txid-bot-framework
          path: txid-bot-framework-checkout
          ref: main

      - name: Stage framework sibling
        run: mv txid-bot-framework-checkout ../txid-bot-framework

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Run unit tests before producing a binary. Locks in the kosha_notice
      # pairing invariants (no sticky / 1 sticky / N stickies / invariant
      # break must drop the row) so the title<->URL off-by-one bug cannot
      # silently regress on a future refactor. If tests fail, the bot does
      # NOT run, so no wrong-URL notifications can go out.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o safety-alarm-bot .

      # Persist bot_seen across runs. Without this every scheduled run
      # starts from an empty SQLite and would treat the existing
      # backlog as new alerts.
      #
      # Cache key prefix bumped to v2 on 2026-05-19 to invalidate the
      # broken legacy caches that only contained the 250-byte schema-only
      # main DB (the WAL sidecar was never captured, so every restore
      # was effectively an empty DB and dedup was silently disabled —
      # the bot redispatched up to 10 kosha_* items every 30 minutes).
      - name: Restore framework DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/safety-alarm.db
          key: safety-alarm-db-v2-${{ github.run_id }}
          restore-keys: safety-alarm-db-v2-

      - name: Run bot (skip moel — runs from dell instead, see Korean IP requirement)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
          NOTIFICATION_HUB_URL: ${{ secrets.NOTIFICATION_HUB_URL }}
          NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
          BAND_KEY: ${{ secrets.BAND_KEY }}
          SAFETY_ALARM_SKIP: moel
          BOOTSTRAP_DEDUP: ${{ github.event.inputs.bootstrap == 'true' && '1' || '' }}
        run: ./safety-alarm-bot

      # Defense in depth — main.go already runs PRAGMA wal_checkpoint on
      # exit, but if the binary ever crashes mid-poll the WAL sidecar can
      # still hold uncommitted rows. Force a TRUNCATE checkpoint so the
      # cache step only needs to capture data/safety-alarm.db itself.
      - name: Checkpoint WAL into main DB
        if: always()
        run: |
          if [ -f data/safety-alarm.db ]; then
            sqlite3 data/safety-alarm.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi

      - name: Save framework DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/safety-alarm.db
          key: safety-alarm-db-v2-${{ github.run_id }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_post_ids.json
          git diff --cached --quiet || git commit -m "chore: update last_post_ids"
          git push

name: Check Safety Notices

on:
  schedule:
    # UTC 기준 (KST = UTC+9)
    # KST 08:07~18:37 사이 30분 간격 실행
    # UTC 23:07~09:37
    #
    # ⚠**이 schedule 은 이제 폴백이다.** 주 트리거는 맥 launchd
  #   `uk.txid.gha-dispatch-safety-alarm`(30분, 평일 KST 08~18시)이 `gh workflow run`
  #   으로 깨운다. 맥이 꺼져 있을 때만 아래 cron 이 의미가 있다.
  # ⚠**분 오프셋 조정은 효과가 없었다 — 다시 시도하지 말 것.** 0,30 → 7,37 로 옮기고
  #   24.3시간 재측정한 결과 설계 약 21슬롯 대비 **3회(14%)** 였다(2026-09-15).
  #   형제 리포 best-archive 도 같은 조정 후 6.6→4.7회/일로 오히려 줄었다.
  #   GitHub 의 cron 배달은 best-effort 이고 우리가 돌릴 손잡이는 여기 없다.
  # (아래는 그때의 근거 기록)
  # ⚠분(minute)을 0,30 이 아니라 7,37 로 둔 이유: GitHub 의 스케줄러는
    #   정시·30분 정각에 가장 붐벼 큐잉이 심하다(공식 문서도 "run at a
    #   different time of the hour" 권고). 0,30 이던 2026-09-02~11 실측은
    #   설계 22회/일 중 3~4회만 실행됐고(00:42/04:06/09:02/13:43Z 패턴),
    #   대부분의 트리거가 시간 단위로 밀리다 소실됐다. 분 오프셋은 이를
    #   완화하는 리포 안의 유일한 손잡이다 — 바꾼 뒤 gh run list 로 실행
    #   횟수가 실제로 늘었는지 다시 잴 것.
    - cron: '7,37 23 * * 0-4'   # KST 08:07, 08:37 (월~금)
    - cron: '7,37 0-9 * * 1-5'  # KST 09:07~18:37 (월~금)
  workflow_dispatch:  # 수동 실행
    inputs:
      bootstrap:
        description: "First-deploy bootstrap (mark all items seen, skip dispatch)"
        type: boolean
        default: false

permissions:
  contents: read

# Opt the Node-20 actions (checkout, cache, setup-go, setup-chrome) into the
# Node 24 runtime ahead of the 2026-06-02 forced cutover. Cleaner than bumping
# each action major one by one — actions/cache and browser-actions/setup-chrome
# have no Node-24 release yet, so this env var covers them all at once.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ⚠**동시 실행을 막아야 한다.** 이 워크플로는 dedup DB 를 캐시에서 restore 하고 끝에
#   save 한다 — 두 실행이 겹치면 늦게 끝난 쪽이 상대의 seen 기록을 덮어써 **이미 보낸
#   공지를 다시 보내거나 새 공지를 조용히 삼킨다.** 2026-09-15 에 맥 launchd 디스패처를
#   붙여 실행 빈도를 설계값으로 되돌리면서(아래 schedule 주석 참고) 겹칠 여지가 생겼다.
#   cancel-in-progress 는 false 다 — 돌던 폴을 죽이면 그 회차가 통째로 유실된다.
concurrency:
  group: safety-alarm-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # ⚠ 2026-09-16 신설. 없으면 멎은 한 회차가 GitHub 기본 **360분**까지 in_progress 로
    #   남는다. 그 사이 launchd 디스패처(gha-dispatch.sh)는 busy 를 보고 exit 0 으로
    #   조용히 넘어가므로 연속실패 카운터가 오르지 않아 **경보 임계에 영영 닿지 않는다**.
    #   concurrency 가 cancel-in-progress: false 라 폴백 cron 도 함께 밀린다.
    #   형제 best-archive bot.yml 은 12분을 쓴다 — 같은 값으로 맞춘다.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      # go.mod uses `replace ../txid-bot-framework` (local dev convention).
      # Check the framework out as a sibling so the GHA build resolves it.
      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: bc1qwerty/txid-bot-framework
          path: txid-bot-framework-checkout
          ref: main

      - name: Stage framework sibling
        run: mv txid-bot-framework-checkout ../txid-bot-framework

      # ⚠ 2026-09-16 신설. go.mod 의 `replace => ../txid-bot-framework` 때문에 빌드정보에는
      #   프레임워크가 `(devel)` 로만 남아, **프로드 바이너리가 어느 프레임워크 커밋으로
      #   만들어졌는지 알 수 없다.** 이 함대는 그 때문에 두 번 헤맸다(nara-bot·bangool-bot).
      #   ldflags 는 `go version -m` 의 build 설정으로 남고(실증함) 기동 로그에도 찍힌다.
      - name: Capture framework revision
        id: fwrev
        run: echo "sha=$(git -C ../txid-bot-framework rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # ⚠ 2026-09-16: '1.24' → '1.26'. 선언이 **거짓이었고 그 대가가 실제 취약점이었다.**
          #   go.mod 가 `go 1.25.0` 이라 Go 가 자동 승격해 실제로는 go1.25.0 으로 빌드됐다
          #   (CI 로그: "Setup go version spec 1.24" / "go version go1.25.0"). 즉 선언한
          #   1.24 는 아무 의미가 없었고, 대신 **go.mod 의 최소값에 정확히 고정**됐다.
          #   실측(govulncheck, GOTOOLCheck 툴체인 고정): go1.25.0 에서 도달 가능한
          #   stdlib 취약점 **24건**(crypto/x509 포함 — notifyhub 의 HTTPS 호출로 도달),
          #   go1.26.8 에서 **0건**. 형제 bid-alert·food-recall·realestate 는 이미 1.26 이다.
          #   ⚠`go-version-file: go.mod` 로 바꾸지 않는다 — 그러면 최소값(1.25.0)에 다시
          #     고정돼 지금 상태로 되돌아간다. 최소 요구와 «빌드에 쓸 툴체인» 은 다른 값이다.
          go-version: '1.26'
          cache: true

      - name: Install Chrome
        # ⚠ 2026-09-16: 서드파티 액션을 **이동 태그가 아니라 커밋 SHA** 로 고정한다.
        # `@v3` 같은 태그는 업스트림이 언제든 옮길 수 있고, 그 순간 이 워크플로가
        # 새 코드를 그대로 실행한다 — 봇 시크릿이 있는 잡에서 돈다.
        # 고정한 SHA 는 **고정 시점에 그 태그가 가리키던 바로 그 커밋**이라 동작은 달라지지 않는다.
        # ⚠핀은 저절로 갱신되지 않는다. 가끔 사람이 확인할 것(세 줄):
        #   gh api repos/browser-actions/setup-chrome/git/ref/tags/v1 --jq .object.sha
        #   gh api repos/browser-actions/setup-chrome/releases/latest --jq .tag_name
        #   (태그가 옮겨졌으면 위 SHA 가 아래 핀과 달라진다)
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable

      # Run unit tests before producing a binary. Locks in the kosha_notice
      # pairing invariants (no sticky / 1 sticky / N stickies / invariant
      # break must drop the row) so the title<->URL off-by-one bug cannot
      # silently regress on a future refactor. If tests fail, the bot does
      # NOT run, so no wrong-URL notifications can go out.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build -ldflags="-X main.frameworkRev=${{ steps.fwrev.outputs.sha }}" -o safety-alarm-bot .

      # Persist bot_seen across runs. Without this every scheduled run
      # starts from an empty SQLite and would treat the existing
      # backlog as new alerts.
      #
      # Cache key prefix bumped to v2 on 2026-05-19 to invalidate the
      # broken legacy caches that only contained the 250-byte schema-only
      # main DB (the WAL sidecar was never captured, so every restore
      # was effectively an empty DB and dedup was silently disabled —
      # the bot redispatched up to 10 kosha_* items every 30 minutes).
      - name: Restore framework DB cache
        uses: actions/cache/restore@v4
        with:
          # 🔴 **`path` 를 바꾸면 기존 캐시가 전부 무효가 된다.** actions/cache 는 경로 목록을
          #   캐시 «버전» 해시에 넣으므로, 목록이 달라진 순간 restore-keys 가 옛 캐시를 못 찾는다.
          #   이 리포에서 그 값은 **dedup 상태의 유일한 사본**이라, 곧바로 부트스트랩이 돌고
          #   그때 보이던 목록이 발송 없이 seen 처리된다. 2026-09-16 에 이 커밋이 실제로 그랬다
          #   (219행 → 60건 부트스트랩, 노출 창 약 6분). 다음에 이 목록을 손대야 한다면
          #   **그 비용을 미리 알고** 조용한 시간대에 할 것.
          # ⚠ 2026-09-16: WAL 사이드카를 함께 담는다. 형제 best-archive bot.yml 은
          #   처음부터 그렇게 하고 있었는데 여기만 `.db` 하나였다(정책이 일부 경로에만).
          #   아래 체크포인트 스텝이 그것을 접어 넣어 주기는 하지만, 그 스텝은
          #   `sqlite3 … || true` 라 sqlite3 가 없거나 실패하면 **조용히 안 접힌다**.
          #   그러면 마지막 폴의 dedup 행이 캐시에서 빠지고, 다음 실행이 그만큼을
          #   신규로 보아 **같은 공지를 다시 보낸다**.
          path: |
            data/safety-alarm.db
            data/safety-alarm.db-wal
            data/safety-alarm.db-shm
          key: safety-alarm-db-v2-${{ github.run_id }}
          restore-keys: safety-alarm-db-v2-

      # ⚠ dedup 네임스페이스 이관(2026-09-08). 프레임워크가 bot_seen 키로
      # MultiSource 의 합성 이름(`multi[하위소스 목록]`)을 쓰던 시절의 캐시가
      # 남아 있으면, 하위 소스별 dedup 으로 바뀐 첫 실행에서 백로그가 전부
      # 신규로 보이고 MaxItemsPerPoll(10) 초과분이 **발송 없이 seen 처리돼
      # 영구 유실**된다. mac 에서 실제로 그 사고를 한 번 냈다(신규 8건 중
      # 7건 유실, kosha_accident 5건 포함 — 수동 복구함).
      #
      # 이 스텝은 멱등이다: 옮길 행이 없으면 아무것도 하지 않는다. 캐시가
      # 언제 갱신되든 자기 치유되도록 매 실행에 둔다.
      - name: Migrate dedup namespace (idempotent)
        run: |
          if [ -f data/safety-alarm.db ]; then
            ./scripts/migrate-dedup-namespace.sh data/safety-alarm.db --apply
          else
            echo "캐시 DB 가 없다 — 첫 실행이거나 캐시 미스. 이관 불필요."
          fi

      # ⚠ dedup 상태의 유일한 사본이 이 캐시다. 없어지면(7일 미접근, 리포 10GB 초과,
      #   수동 삭제) 빈 DB 로 봇이 뜨고 크롤한 글 전부가 신규로 보인다. 그러면
      #   MaxItemsPerPoll(10) 초과분이 **발송 없이 seen 처리돼 영구 유실**된다.
      #   위 v2 주석이 바로 그 사고의 기록이다 — 깨진 캐시가 사실상 빈 DB 였고
      #   dedup 이 조용히 꺼져 있었다. 2026-09-08 에는 같은 결말을 낡은 바이너리가
      #   만들어 7건을 잃었다. 방아쇠만 다를 뿐 결말은 늘 같다.
      #
      #   BOOTSTRAP_DEDUP 은 이미 있었지만 **수동 dispatch 입력으로만** 켤 수 있었다.
      #   캐시 미스는 job 실패가 아니라 아무 신호도 없으므로, 사람이 그 입력을 켜야
      #   한다는 사실을 알 방법이 없다. 자동으로 판정한다.
      #
      #   판정은 cache-hit 출력이 아니라 **파일 존재와 크기**로 한다 — restore-keys
      #   부분일치일 때 cache-hit 은 false 이고, 위 v2 사고처럼 250바이트짜리 껍데기가
      #   복원되는 경우도 있다. 실제로 쓸 수 있는 DB 인지를 본다.
      #   ⚠ "판정 실패" 와 "0행" 을 반드시 구분한다. sqlite3 가 없어졌을 때 그것을
      #   0행으로 뭉뚱그리면 매 실행이 부트스트랩이 되고 **봇이 영구히 조용해진다** —
      #   막으려던 유실보다 나쁘다. 판정할 수 없으면 정상으로 두고 그 사실을 알린다
      #   (check-unpushed 의 "판정 불능" 과 같은 처리).
      - name: Detect dedup cache loss
        id: dedup-state
        run: |
          DB=data/safety-alarm.db
          if ! command -v sqlite3 >/dev/null 2>&1; then
            BOOT=0; REASON="sqlite3 가 없어 판정 불능 — 이번엔 정상으로 두지만 유실 감시가 꺼져 있다"; LEVEL=warn
          elif [ ! -s "$DB" ]; then
            BOOT=1; REASON="DB 파일이 없거나 비어 있다"; LEVEL=loss
          elif ! ROWS=$(sqlite3 "$DB" 'SELECT COUNT(*) FROM bot_seen;' 2>/dev/null); then
            BOOT=1; REASON="bot_seen 조회 실패 — 스키마가 깨졌다"; LEVEL=loss
          elif [ "$ROWS" -eq 0 ]; then
            BOOT=1; REASON="bot_seen 0행 (250바이트 껍데기 캐시가 복원됐을 때의 모습이다)"; LEVEL=loss
          else
            BOOT=0; REASON="bot_seen ${ROWS}행 — 정상"; LEVEL=ok
          fi
          echo "bootstrap=$BOOT" >> "$GITHUB_OUTPUT"
          echo "판정: $REASON (bootstrap=$BOOT)"
          [ "$LEVEL" = ok ] && exit 0
          echo "::warning::$REASON"
          if [ "$LEVEL" = loss ]; then
            TEXT="🟠 safety_alarm dedup 캐시 유실%0A${REASON}%0A이번 실행은 발송 없이 재수립만 합니다(한 주기 누락).%0A반복되면 캐시 대신 영속 저장소를 검토하세요."
          else
            TEXT="🟠 safety_alarm dedup 감시 불능%0A${REASON}"
          fi
          # ⚠ 2026-09-15: 이 경보가 자기 실패를 삼키고 있었다. `-s … || true` 는 401·403·429 를
          #   전부 exit 0 으로 덮어서, dedup 캐시 유실이라는 «사람이 봐야 하는» 신호가
          #   말없이 사라질 수 있었다. 실패해도 봇 실행은 계속해야 하므로(여기서 죽이면
          #   이번 주기가 통째로 날아간다) 잡을 세우지는 않고 ::error:: 로 남긴다.
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${TEXT}%0A로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || echo "::error::경보 텔레그램 발송 실패 — dedup 유실이 사람에게 닿지 않았다"

      - name: Run bot (skip moel — runs from dell instead, see Korean IP requirement)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
          NOTIFICATION_HUB_URL: ${{ secrets.NOTIFICATION_HUB_URL }}
          NOTIFICATION_SECRET: ${{ secrets.NOTIFICATION_SECRET }}
          BAND_KEY: ${{ secrets.BAND_KEY }}
          SAFETY_ALARM_SKIP: moel
          # 수동 dispatch 로 켜거나, 위에서 캐시 유실이 감지되면 자동으로 켜진다.
          BOOTSTRAP_DEDUP: ${{ (github.event.inputs.bootstrap == 'true' || steps.dedup-state.outputs.bootstrap == '1') && '1' || '' }}
        run: ./safety-alarm-bot

      # Defense in depth — main.go already runs PRAGMA wal_checkpoint on
      # exit, but if the binary ever crashes mid-poll the WAL sidecar can
      # still hold uncommitted rows. Force a TRUNCATE checkpoint so the
      # cache step only needs to capture data/safety-alarm.db itself.
      - name: Checkpoint WAL into main DB
        if: always()
        run: |
          if [ -f data/safety-alarm.db ]; then
            sqlite3 data/safety-alarm.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi

      - name: Save framework DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          # ⚠ restore 와 같은 목록이어야 한다 — 한쪽만 고치면 사이드카가 저장은 되는데
          #   복원이 안 되거나 그 반대가 된다.
          path: |
            data/safety-alarm.db
            data/safety-alarm.db-wal
            data/safety-alarm.db-shm
          key: safety-alarm-db-v2-${{ github.run_id }}
